spring.application.name=interviewai

# Server
server.port=${PORT:8080}

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/interview-master}}
spring.data.mongodb.database=${MONGODB_DB:interview-master}

# JWT
jwt.secret=${JWT_SECRET:fallbackSuperSecretKeyForDevelopmentOnlyPleaseChangeInProduction}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Google Gemini AI
google.genai.api-key=${GEMINI_API_KEY:${GOOGLE_GENAI_API_KEY}}
google.genai.model=${GEMINI_MODEL:gemini-2.5-flash}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# File upload limit (for resume PDF upload)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
